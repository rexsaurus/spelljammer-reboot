<!doctype html>
<html><head><meta charset="utf-8"><title>Spelljammer Reboot — Play</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;font:13px monospace;color:#fd8}
#hud{position:fixed;left:10px;top:10px;white-space:pre;text-shadow:0 0 3px #000;pointer-events:none}
#panel{position:fixed;inset:5% 8%;display:none;background:#100c;border:2px solid #a73;padding:14px;overflow:auto;gap:18px}
#panel canvas{image-rendering:pixelated;width:480px;border:1px solid #a73}
#panel button{font:12px monospace;background:#311;color:#fd8;border:1px solid #a73;margin:1px;cursor:pointer}
#panel table{border-collapse:collapse} #panel td{padding:1px 6px}
#log{position:fixed;left:10px;bottom:10px;white-space:pre;opacity:.85;pointer-events:none}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#f88;text-align:center}</style>
</head><body><div id="hud"></div><div id="log"></div><div id="panel"></div><div id="err"></div>
<script type="module" src="/src/play/main.js"></script></body></html>
